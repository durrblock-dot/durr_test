<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Binding of Isaac Flash</title>
  <script src="ruffle.js"></script>
  <style>
    body {
      background: #000;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #game { width: 800px; height: 600px; }
  </style>
</head>
<body>
<div id="game"></div>
<script>
window.addEventListener("DOMContentLoaded", () => {
    const ruffle = window.RufflePlayer.newest();
    const player = ruffle.createPlayer();
    document.getElementById("game").appendChild(player);

    // Load the local SWF
    player.load("isaac_game.swf");
});
</script>
</body>
</html>
