<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Binding of Isaac Flash</title>
<script src="ruffle.js"></script>
<style>
  body {
    margin: 0;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  #game {
    width: 640px;
    height: 480px;
  }
</style>
</head>
<body>

<div id="game"></div>

<script>
  // Create Ruffle instance and load SWF
  const ruffle = window.RufflePlayer.newest();
  const player = ruffle.createPlayer();
  document.getElementById("game").appendChild(player);
  player.load("isaac_game.swf"); // must match SWF filename
</script>

</body>
</html>
