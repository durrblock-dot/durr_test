<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Binding of Isaac Flash</title>

<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

<style>
body{
background:#000;
margin:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Arial;
}

#game{
width:640px;
height:480px;
}
</style>

</head>

<body>

<div id="game"></div>

<script>

window.RufflePlayer = window.RufflePlayer || {};
window.addEventListener("load", () => {

const ruffle = window.RufflePlayer.newest();
const player = ruffle.createPlayer();

document.getElementById("game").appendChild(player);

player.load("isaac.swf");

});

</script>

</body>
</html>
